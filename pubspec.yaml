name: campuspulse
description: "Application de gestion d'emploi du temps en temps réel pour l'UADB - Master 1."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 1. Navigation & Gestion d'état (Architecture)
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.1

  # 2. Réseau & API
  dio: ^5.4.1
  connectivity_plus: ^4.0.1

  # 3. Base de données locale (Cache Hors-ligne)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 4. Notifications & Design UI
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.6
  device_preview: ^1.1.0
  firebase_core: ^4.9.0
  firebase_database: ^12.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Générateurs de code pour la base locale Hive
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true